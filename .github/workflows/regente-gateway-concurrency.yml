name: Regente Gateway real PostgreSQL concurrency

on:
  pull_request:
    paths:
      - 'regente-1.0-preview/**'
      - '.github/workflows/regente-gateway-concurrency.yml'

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REGENTE_PG_ISOLATED: '1'
      REGENTE_PG_ADMIN_URL: postgresql://postgres:synthetic_test_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --prefix regente-1.0-preview --ignore-scripts --no-audit --no-fund
      - name: Reproduce pre-fix authorization races on PostgreSQL
        env:
          REGENTE_TEST_BASELINE: '1'
          REGENTE_PG_REPORT: baseline-concurrency.json
        run: |
          if node regente-1.0-preview/tests/gateway-concurrency.cjs; then
            echo 'Baseline unexpectedly passed; regressions were not reproduced'
            exit 1
          fi
          node - <<'NODE'
          const assert=require('node:assert/strict'),r=require('./baseline-concurrency.json');
          assert(!r.fatal,r.fatal);
          assert.equal(r.results.length,20);
          assert.deepEqual(r.results.filter(x=>!x.passed).map(x=>x.name),[
            'Emergency stop committed while arm waits blocks dispatch',
            'Expired authorization cannot dispatch after lock wait'
          ]);
          NODE
      - name: Run corrected Gateway with independent processes and connections
        env:
          REGENTE_PG_REPORT: corrected-concurrency.json
        run: node regente-1.0-preview/tests/gateway-concurrency.cjs
      - name: Run existing Node and PGlite regressions
        run: |
          node --test regente-1.0-preview/tests/*.test.cjs
          node regente-1.0-preview/tests/gateway-db-check.cjs
