name: Regente production verification

on:
  push:
    branches:
      - fix/regente-master-access

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production protection
        run: |
          set -e
          ROOT_STATUS=$(curl -sS -o /tmp/root-body -D /tmp/root-headers -w "%{http_code}" https://optotica-regente.vercel.app/)
          LOGIN_STATUS=$(curl -sS -o /tmp/login-body -D /tmp/login-headers -w "%{http_code}" https://optotica-regente.vercel.app/entrar/master)
          API_STATUS=$(curl -sS -o /tmp/api-body -D /tmp/api-headers -w "%{http_code}" \
            -X POST https://optotica-regente.vercel.app/api/regente \
            -H "Content-Type: application/json" \
            --data '{"objective":"probe"}')
          echo "ROOT_STATUS=$ROOT_STATUS"
          grep -i '^location:' /tmp/root-headers || true
          echo "LOGIN_STATUS=$LOGIN_STATUS"
          echo "API_STATUS=$API_STATUS"
          cat /tmp/api-body
          echo
          if [ "$ROOT_STATUS" != "307" ] && [ "$ROOT_STATUS" != "302" ]; then exit 1; fi
          if [ "$LOGIN_STATUS" != "200" ]; then exit 1; fi
          if [ "$API_STATUS" != "401" ]; then exit 1; fi
