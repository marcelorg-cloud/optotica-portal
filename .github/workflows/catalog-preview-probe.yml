name: Preview access probe

on:
  push:
    branches:
      - feat/catalog-birefnet-mask

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe preview
        run: |
          set -x
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt -w "HTTP_STATUS=%{http_code}\n" \
            "https://optotica-portal-git-feat-catalog-birefnet-mask-admin-26358549.vercel.app/"
          cat /tmp/headers.txt
          head -c 500 /tmp/body.txt || true
