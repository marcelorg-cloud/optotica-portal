name: Regente recovery check

on:
  push:
    branches:
      - fix/regente-recovery-agent

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
