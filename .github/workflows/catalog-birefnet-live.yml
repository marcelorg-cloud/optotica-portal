name: Catalog BiRefNet live samples

on:
  push:
    branches:
      - feat/catalog-birefnet-mask

jobs:
  live-samples:
    runs-on: ubuntu-latest
    env:
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify Replicate secret
        run: |
          if [ -z "$REPLICATE_API_TOKEN" ]; then
            echo "REPLICATE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Generate before/after samples
        run: node scripts/catalog-birefnet-live-test.mjs
      - name: Upload sample artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-birefnet-live
          path: artifacts/catalog-birefnet-live
          if-no-files-found: warn
