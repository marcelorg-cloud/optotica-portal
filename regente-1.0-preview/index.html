ist-row" onclick="nav('mission',{missionId:'${m.id}'})"><span><b>${E(m.title)}</b><small>${E(projects.find(p=>p.id===m.project).name)} · ${m.results.filter(r=>r.status==='aceito').length} resultados aceitos</small></span>${statePill(m.status)}</button>`).join('')}</section><section class="card"><div class="section-header"><h2>Saúde da Orquestra</h2><button class="action-link" onclick="nav('orchestra')">Administrar</button></div><p class="hint">O catálogo de capacidades deve distinguir instrumento listado, adapter configurado e prontidão de cada operação.</p><div class="statline"><span>Participantes no modelo</span><strong>${demo.instruments.length}</strong></div><div class="statline"><span>Verificados (somente na simulação)</span><strong>${demo.instruments.filter(x=>x.status==='verificado').length}</strong></div><div class="statline"><span>Prontidão pendente ou desconhecida</span><strong>${demo.instruments.filter(x=>x.status!=='verificado').length}</strong></div><hr class="separator"><button class="btn btn-small" onclick="nav('orchestra')">⌘ Abrir nós e laços</button></section></div>`}

ultados'],['historico','Histórico']].map(([v,l])=>`<button class="tab ${s.phase===v?'active':''}" onclick="appAct('phase','${v}')">${l}</button>`).join('')}</div><div class="phase-content">${s.phase==='afinamento'?afinamento(m):s.phase==='execucao'?execucao(m):s.phase==='resultados'?resultados(m):historico(m)}</div></section></div><div class="footer-note">Protótipo local · ações simuladas · sem API, pagamentos, autenticação ou gravação de dados reais.</div>`}
function afinamento(m){const promptKeys=[['objective','Objetivo consolidado'],['criteria','Critérios essenciais'],['scope','Escopo e limites'],['plan','Plano e paralelismo'],['risks','Riscos e lacunas']];return `<div class="row spread" style="align-items:flex-start"><div><h2 class="phase-title">Prompt Afinado</h2><p class="hint" style="margin:0 0 13px">Vista legível da Partitura da Missão. A aprovação será vinculada à versão exata.</p></div><div class="right-actions"><button class="btn btn-small" onclick="openModal('diff')">↔ Diferenças</button><button class="btn btn-small" onclick="appAct('promptEdit')">${s.editing?'Cancelar edição':'✎ Editar'}</button></div></div><div class="prompt-head"><div class="row spread"><strong>Versão ${m.promptVersion}.0 · elaboração para Execução</strong>${pill('Prévia da missão','blue')}</div><div class="smallnote mini-mono">Identificador local: ${hash(JSON.stringify(m.prompt))} · sem assinatura criptográfica</div></div>${s.editing?`<form class="prompt-editor" onsubmit="appAct('savePrompt');return false">${promptKeys.map(([key,title])=>`<div class="field"><label for="pr-${key}">${title}</label><textarea id="pr-${key}" rows="3">${E(m.prompt[key])}</textarea></div>`).join('')}<div class="row"><button class="btn btn-primary" type="submit">Salvar nova versão</button><button type="button" class="btn" onclick="appAct('promptEdit')">Cancelar</button></div></form>`:`${promptKeys.map(([key,title])=>`<div class="prompt-section"><strong>${title}</strong><p>${E(m.prompt[key])}</p></div>`).join('')}`}<div style="height:15px"></div><div class="section-header"><h2>Diagnóstico de Afinamento</h2>${pill('Demonstração')}</div><div class="grid cols-2"><div class="policy-box"><h4>Coerência</h4><p>Objetivos e restrições explicitados na proposta.</p></div><div class="policy-box"><h4>Prontidão</h4><p>Conexões externas não verificadas neste HTML.</p></div><div class="policy-box"><h4>Oito papéis</h4><p>Responsabilidades contempladas, incluindo auditoria do Prompt Afinado.</p></div><div class="policy-box"><h4>Independência</h4><p>Entregáveis planejados em tarefas sem dependências artificiais.</p></div></div><div class="alert" style="margin-top:17px">⚠ Este diagnóstico é ilustrativo. A versão produtiva exigirá evidências reais de C01–C08, A5 e S00.</div><div class="section-header" style="margin-top:20px"><h2>Próximo passo</h2></div>${m.approved?`<div class="alert good">O Afinamento v${m.promptVersion} está autorizado na demonstração. Seu envelope consta da Fase 2.</div><button class="btn btn-primary" onclick="appAct('phase','execucao')">Ir para Execução →</button>`:`<p class="hint">Confira o Prompt Afinado e autorize antecipadamente as operações de classes 1 e 2 necessárias à missão. Operações de classe 3 permanecem ligadas à versão final do resultado.</p><button class="btn btn-primary" onclick="openModal('grantEnvelope')" ${s.editing?'disabled':''}>✓ Aprovar Afinamento e autorizações →</button>`}`}

function execucao(m){const runs=m.tasks.filter(x=>x.status!=='planejada').length;return `<div class="row spread"><div><h2 class="phase-title">Execução coordenada</h2><p class="hint" style="margin:0 0 15px">Compassos paralelos, checkpoints e isolamento dos bloqueios.</p></div>${pill(m.approved?'Envelope autorizado':'Envelope pendente',m.approved?'good':'warn')}</div>${!m.approved?`<div class="alert">A Execução só começa após aprovação do Prompt Afinado e do envelope de operações.</div><div style="height:12px"></div><button class="btn btn-primary" onclick="openModal('grantEnvelope')">Ver autorizações antecipadas</button>`:`<div class="row wrap" style="margin-bottom:13px"><button class="btn btn-small ${m.paused||m.stopped?'btn-primary':''}" onclick="appAct('pauseMission')">${m.paused||m.stopped?'▶ Retomar missão':'Ⅱ Pausar missão'}</button><button class="btn btn-small btn-primary" onclick="appAct('advanceDemo')" ${m.paused||m.stopped?'disabled':''}>Avançar simulação →</button>${m.tasks.some(x=>x.status==='bloqueada')?`<button class="btn btn-small" onclick="appAct('resolveBlock')">↻ Resolver bloqueio fictício</button>`:''}</div><div class="alert ${m.paused||m.stopped?'danger':'good'}">${m.stopped?'Parada global acionada: nenhum efeito adicional é autorizado até nova aprovação.':m.paused?'Missão pausada; nenhuma nova etapa será iniciada.':'Operações são apenas simuladas. A interface não invoca nenhum provedor real.'}</div><div style="height:12px"></div><div class="section-header"><h2>Etapas operacionais</h2>${pill(`${runs} de ${m.tasks.length} com atividade`)}</div>${m.tasks.map((t,i)=>`<div class="task-row"><div class="task-marker">${String(i+1).padStart(2,'0')}</div><div class="task-main"><strong>${E(t.name)}</strong><small>${E(t.instrument)} · independente ${i<2?'em paralelo':'quando possível'}</small></div>${statePill(t.status)}</div>`).join('')}<div class="policy-box" style="margin-top:16px"><h4>Permissões vigentes nesta demonstração</h4><p>Classe 1: branch, preview, testes. Classe 2: ${m.permissions.conditional?'regra condicional autorizada':'não autorizada'}. Classe 3: aprovada somente por resultado concreto.</p></div><div class="row wrap" style="margin-top:15px"><button class="btn btn-small" onclick="openModal('envelopeDetails')">◈ Consultar envelope</button><button class="btn btn-small" onclick="appAct('phase','resultados')">▤ Abrir Resultados</button></div>`}`}
function resultados(m){const produced=m.results.filter(r=>['produzido','aceito','publicado'].includes(r.status)).length,accepted=m.results.filter(r=>r.status==='aceito'||r.status==='publicado').length,req=m.results.filter(r=>r.required),complete=req.every(r=>['aceito','publicado'].includes(r.status));return `<div class="section-header"><div><h2 class="phase-title">Central de Resultados</h2><p class="hint" style="margin:3px 0">Cada entregável tem histórico, estado e revisão próprios.</p></div><button class="btn btn-small" onclick="appAct('downloadManifest')">↓ Manifesto</button></div><div class="grid cols-3" style="margin:17px 0 13px"><div class="card kpi"><div class="label">Planejados</div><div class="num">${m.results.length}</div></div><div class="card kpi"><div class="label">Produzidos</div><div class="num">${produced}</div></div><div class="card kpi"><div class="label">Aceitos</div><div class="num">${accepted}</div></div></div>${m.results.map(r=>`<div class="result-row"><div class="task-marker">${r.kind==='HTML'?'⌘':r.kind==='Código'?'⌥':r.kind==='Relatório'?'▤':'▧'}</div><div class="task-main"><strong>${E(r.name)} ${r.required?'<span title="Critério essencial">*</span>':''}</strong><small>v${r.version} · ${E(r.kind)} · ${E(r.explanation)}</small><div class="compact-actions"><button class="action-link" onclick="openModal('result',{resultId:'${r.id}'})">Abrir</button><button class="action-link" onclick="appAct('downloadResult','${r.id}')" ${!['produzido','aceito','publicado'].includes(r.status)?'disabled':''}>Baixar</button>${['produzido','auditado','confirmado'].includes(r.status)?`<button class="action-link" onclick="appAct('acceptResult','${r.id}')">Aceitar</button>`:''}<button class="action-link" onclick="openModal('refineResult',{resultId:'${r.id}'})">Ajustar / Refazer</button><button class="action-link" onclick="appAct('branchResult','${r.id}')">Desdobrar</button>${r.publishable&&['produzido','aceito'].includes(r.status)?`<button class="action-link" onclick="openModal('publish',{resultId:'${r.id}'})">Aprovar e publicar</button>`:''}</div></div>${statePill(r.status)}</div>`).join('')}<div class="alert ${complete?'good':''}" style="margin-top:14px">${complete?'Todos os resultados essenciais foram aceitos. O Maestro pode concluir a missão.':'Ainda há resultados essenciais sem aceite. Entregáveis independentes podem continuar sendo revisados e aceitos.'}</div><div class="row wrap" style="margin-top:14px"><button class="btn btn-primary" onclick="appAct('conclude')" ${!complete||m.status==='concluida'?'disabled':''}>✓ Concluir missão</button><button class="btn" onclick="openModal('endWithout')">Encerrar sem concluir</button><button class="btn" onclick="appAct('phase','execucao')">Ver execução</button></div>`}
function historico(m){return `<h2 class="phase-title">Histórico e decisões</h2><p class="hint">Registro demonstrativo de eventos, revisões e alterações. Uma nova versão não elimina a anterior.</p><div class="timeline" style="margin-top:22px">${m.events.map(ev=>`<div class="timeline-item"><b>${E(ev.at)}</b><p>${E(ev.message)}</p></div>`).join('')}</div><div class="policy-box"><h4>Histórico de versões do Prompt Afinado</h4><p>${m.promptHistory.map(v=>'v'+v.v).join(' · ')} — somente revisões realizadas no protótipo.</p></div>`}
function decisionsPage(){return `${heading('Supervisão do Maestro','Caixa de decisões','Concentra exceções e atos que não podem ser delegados. O silêncio nunca significa aprovação.')}${demo.decisions.length?`<section class="card">${demo.decisions.map(d=>`<div class="result-row"><div class="task-marker">!</div><div class="task-main"><strong>${E(d.title)}</strong><small>${E(d.description)} · ${E(d.missionTitle)}</small></div><button class="btn btn-small" onclick="openModal('decision',{decisionId:'${d.id}'})">Avaliar</button></div>`).join('')}</section>`:`<section class="card empty-state"><div style="font-size:28px;margin-bottom:10px">◇</div><strong>Nenhuma decisão excepcional pendente</strong><p class="hint">O exemplo de exceção poderá surgir ao avançar a simulação de Execução.</p><button class="btn btn-small" onclick="nav('mission',{missionId:'m2',phase:'execucao'})">Abrir missão em execução</button></section>`}<section class="card" style="margin-top:17px"><h2>Política de autorização</h2><div class="grid cols-3">${[['Classe 1','Antecipável','Leitura, branch, preview e geração dentro do teto'],['Classe 2','Regra condicionada','Operação permitida somente após evidências suficientes'],['Classe 3','Versão final','Publicação, efeitos irreversíveis e acessos excepcionais']].map(([n,l,d])=>`<div class="class-card"><strong>${n} · ${l}</strong><p class="tagline">${d}</p></div>`).join('')}</div></section>`}
function resourcesPage(){return `${heading('Administração','Recursos e custos','Controle de provedores, consumo observado, estimativas e limites. Valores desta tela são fictícios.') }<div class="demo-alert"><b>◇</b><span>O saldo real depende de dados verificáveis dos provedores. Sem consulta autorizada, o Regente deverá exibir <b>desconhecido</b>. Não existe recarga automática neste protótipo.</span></div><div class="grid cols-3"><div class="card kpi"><div class="label">Teto mensal autorizado</div><div class="num">R$ 0</div><small>Somente demonstração; nenhuma cobrança</small></div><div class="card kpi"><div class="label">Consumo observado</div><div class="num">R$ 0</div><small>Sem conexão com billing</small></div><div class="card kpi"><div class="label">Saldo de provedores</div><div style="font-size:22px;font-weight:720;margin:15px 0">Desconhecido</div><small>Não inventar créditos</small></div></div><section class="card" style="margin-top:18px"><h2>Provedores e instrumentos</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Provedor</th><th>Instrumentos</th><th>Saldo</th><th>Teto</th><th>Controle</th></tr></thead><tbody>${[['OpenAI','A1–A4, C01–C08'],['Claude','A6 (manual)'],['Replicate','F4'],['HeyGen','F7'],['Meta','F9']].map(([name,inst])=>`<tr><td><b>${E(name)}</b></td><td>${E(inst)}</td><td>Desconhecido</td><td>Não configurado</td><td><button class="action-link" onclick="openModal('manageProvider',{provider:'${name}'})">Gerenciar</button></td></tr>`).join('')}</tbody></table></div></section><section class="card" style="margin-top:17px"><h2>Como funcionará a gestão</h2><p class="hint">O sistema diferenciará saldo informado pelo provedor, consumo efetivo, valor reservado para tarefas em paralelo, previsão de custo e teto da missão. A opção de adicionar créditos será um acesso autorizado à página oficial ou uma integração específica futura — nunca uma cobrança inventada.</p></section>`}
function graphPositions(items){const coords={};for(const n of items){let x=0,y=0;if(/^C/.test(n.id)){const i=+n.id.slice(1)-1;x=28;y=41+i*54}else if(/^A/.test(n.id)){const i=+n.id.slice(1)-1;x=265;y=70+i*61}else if(/^F/.test(n.id)){const i=+n.id.slice(1)-1;x=i<7?524:735;y=43+(i%7)*56}else{x=291;y=456}coords[n.id]={x,y};}return coords}
function graphSVG(){const coords=graphPositions(demo.instruments);let edges=demo.links.filter(l=>coords[l.from]&&coords[l.to]).map((l,i)=>{const a=coords[l.from],b=coords[l.to];let active=s.selectedNode===l.from||s.selectedNode===l.to;let sx=a.x+136,sy=a.y+19,ex=b.x,ey=b.y+19;if((a.x>b.x)||a.x===b.x){sx=a.x+68;sy=a.y+40;ex=b.x+68;ey=b.y;}return `<path class="graph-edge ${active?'active':''}" d="M${sx} ${sy} C${(sx+ex)/2} ${sy},${(sx+ex)/2} ${ey},${ex} ${ey}" title="${E(l.from)} → ${E(l.to)} (${E(l.type)})"/>`}).join('');let nodes=demo.instruments.map(n=>{const p=coords[n.id];const title=n.name.length>18?n.name.slice(0,17)+'…':n.name;return `<g class="graph-node ${s.selectedNode===n.id?'selected':''}" tabindex="0" role="button" aria-label="Selecionar ${E(n.id)} ${E(n.name)}" onclick="appAct('nodeSelect','${E(n.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();appAct('nodeSelect','${E(n.id)}')}"><rect x="${p.x}" y="${p.y}" width="136" height="39" rx="9"/><text x="${p.x+9}" y="${p.y+16}">${E(n.id)} · ${E(title)}</text><text class="subnode" x="${p.x+9}" y="${p.y+30}">${E(n.type)} · ${E(n.status)}</text></g>`}).join('');return `<div class="graph-wrap"><svg class="node-graph" viewBox="0 0 930 525" aria-label="Mapa demonstrativo dos nós e laços da Orquestra" role="img"><g>${edges}</g>${nodes}</svg></div>`}
function selectedNodeCard(){const n=demo.instruments.find(x=>x.id===s.selectedNode)||demo.instruments[0],links=demo.links.filter(l=>l.from===n.id||l.to===n.id);return `<div class="node-details"><div class="row spread"><strong>${E(n.id)} — ${E(n.name)}</strong>${pill(n.status,n.status==='verificado'?'good':'warn')}</div><dl><dt>Tipo</dt><dd>${E(n.type)}</dd><dt>Implementação</dt><dd>${E(n.provider)}</dd><dt>Operador</dt><dd>${E(n.operator)}</dd><dt>Laços</dt><dd>${links.length} no cenário</dd></dl><div class="compact-actions"><button class="btn btn-small" onclick="openModal('editNode')">Editar vínculo</button><button class="btn btn-small" onclick="openModal('addLink')">＋ Novo laço</button><button class="btn btn-small btn-danger" onclick="openModal('disableNode')">Desativar</button></div><div class="smallnote">Estas alterações são locais e não mudam o GitHub nem as permissões do Regente real.</div></div>`}
function orchestraPage(){const tabs=[['graph','Nós e laços'],['inventory','Inventário'],['permissions','Permissões'],['connections','Conexões'],['versions','Versões'],['usage','Consumo'],['delegation','Decisões']];return `${heading('Configuração institucional','Administração da Orquestra','Instalar, conectar, atualizar, desativar e organizar instrumentos; laços não concedem privilégios.',`<button class="btn btn-primary" onclick="openModal('addInstrument')">＋ Adicionar instrumento</button>`)}<div class="demo-alert"><b>▧</b><span>Modelo demonstrativo com <b>${demo.instruments.length} participantes</b>. O estado <b>não verificado</b> não significa ferramenta indisponível. Instalação, permissões e conectores aqui não possuem efeito externo.</span></div><section class="card"><div class="tabs">${tabs.map(([v,l])=>`<button class="tab ${s.adminTab===v?'active':''}" onclick="appAct('adminTab','${v}')">${l}</button>`).join('')}</div><div class="phase-content">${s.adminTab==='graph'?`<div class="section-header"><h2>Mapa de nós e laços</h2><div class="right-actions"><button class="btn btn-small" onclick="openModal('addLink')">＋ Criar laço</button><button class="btn btn-small" onclick="openModal('addInstrument')">＋ Instrumento</button></div></div><p class="hint">Selecione um nó no grafo. Os laços podem ser de operação, informação ou dependência de capacidade. Um ciclo na sequência de preparação é rejeitado.</p>${graphSVG()}${selectedNodeCard()}<div class="section-header" style="margin-top:22px"><h2>Laços cadastrados no cenário</h2>${pill(demo.links.length+' ligações')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Origem</th><th>Destino</th><th>Relação</th><th></th></tr></thead><tbody>${demo.links.slice(0,18).map((l,i)=>`<tr><td>${E(l.from)}</td><td>${E(l.to)}</td><td>${E(l.type)}</td><td><button class="action-link" onclick="appAct('removeLink',${demo.links.indexOf(l)})">Remover</button></td></tr>`).join('')}</tbody></table></div>`:s.adminTab==='inventory'?`<div class="section-header"><h2>Inventário de participantes</h2><button class="btn btn-small" onclick="openModal('addInstrument')">＋ Novo</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Instrumento</th><th>Natureza</th><th>Estado (demo)</th><th>Ação</th></tr></thead><tbody>${demo.instruments.map(n=>`<tr><td><b>${E(n.id)}</b></td><td>${E(n.name)}</td><td>${E(n.type)}</td><td>${statePill(n.status)}</td><td><button class="action-link" onclick="appAct('nodeSelect','${E(n.id)}')">Ver relações</button></td></tr>`).join('')}</tbody></table></div>`:s.adminTab==='permissions'?`<h2>Política de permissões</h2><p class="hint">Permissão efetiva = teto permanente ∩ envelope da missão ∩ condições verificáveis. Ampliações dependem do Maestro; restrições valem imediatamente.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Operador</th><th>Instrumento</th><th>Operação</th><th>Classe</th><th>Regra</th></tr></thead><tbody>${[['A1','F1 · GitHub','Branch e commit','1','Dentro de branch autorizada'],['A1','F2 · Vercel','Deploy preview','1','Ambiente isolado'],['A1','F2 · Vercel','Deploy produção','2','Condições verificáveis + regra aprovada'],['S00','F9 · Meta','Publicação de campanha','3','Aprovação por hash final'],['A1','F3-O · Banco Optótica','Migração destrutiva','3','Decisão específica']].map(([a,b,c,d,e])=>`<tr><td>${a}</td><td>${b}</td><td>${c}</td><td>${pill('Classe '+d,d==='3'?'bad':d==='2'?'warn':'good')}</td><td>${e}</td></tr>`).join('')}</tbody></table></div><div class="compact-actions"><button class="btn btn-small" onclick="openModal('policy')">Editar proposta de teto</button></div>`:s.adminTab==='connections'?`<h2>Vínculos e verificações</h2><p class="hint">O papel é independente do provedor e do modelo. A troca de implementação gera nova versão e requer ensaio.</p>${demo.instruments.filter(n=>['A4','A5','A6','F1','F2','F9'].includes(n.id)).map(n=>`<div class="task-row"><div class="task-marker">${n.id.slice(0,1)}</div><div class="task-main"><strong>${E(n.id)} · ${E(n.name)}</strong><small>${E(n.provider)} · ${E(n.operator)}</small></div>${statePill(n.status)}</div>`).join('')}<div class="compact-actions"><button class="btn btn-small" onclick="openModal('readiness')">Verificar agora (simulação)</button></div>`:s.adminTab==='versions'?`<h2>Versionamento e fonte canônica</h2><div class="policy-box"><h4>GitHub — referência documental oficial</h4><p>Constituição, Grade, partituras, contratos e regras transversais são versionados. Alterações propostas no painel devem gerar PR e revisão, não sobrescrever o repositório automaticamente.</p></div><div class="statline"><span>Grade demonstrativa</span><strong>Regente 1.0 · candidata</strong></div><div class="statline"><span>GitHub conectado ao protótipo</span><strong>Não</strong></div><div class="statline"><span>Missões em curso</span><strong>Versões fixadas</strong></div><div class="compact-actions"><button class="btn btn-small" onclick="openModal('proposeVersion')">Visualizar proposta de PR</button></div>`:s.adminTab==='usage'?`<h2>Consumo dos instrumentos</h2><p class="hint">A origem de consumo deverá ser rastreável por provedor, projeto, missão e tarefa. Sem fonte, mostrar desconhecido.</p><div class="statline"><span>Saldo real</span><strong>Desconhecido</strong></div><div class="statline"><span>Teto autorizado neste HTML</span><strong>R$ 0</strong></div><button class="btn btn-small" onclick="nav('resources')">Abrir recursos e custos</button>`:`<h2>Decisões e delegações</h2><p class="hint">Agentes podem propor mudanças, mas ampliar permissões requer decisão autenticada e vinculada ao objeto exato.</p><div class="statline"><span>Delegação operacional real</span><strong>Não configurada</strong></div><div class="statline"><span>Aprovação por chat</span><strong>Não habilitada</strong></div><button class="btn btn-small" onclick="nav('decisions')">Abrir caixa de decisões</button>`}</div></section>`}
const ensureMissionResult=(m,resultId)=>m.results.find(r=>r.id===resultId);
function downloadText(name,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resultText(m,r){return `REGENTE 1.0 — DEMONSTRAÇÃO\nMissão: ${m.title}\nResultado: ${r.name}\nVersão: ${r.version}\nEstado: ${r.status}\nID demonstrativo: ${hash(r.source+r.version)}\n\n${r.source}\n\nNenhum dado real foi processado.`}
function addDecision(m){if(demo.decisions.some(d=>d.missionId===m.id&&d.type==='exception'))return;demo.decisions.push({id:'dec'+Date.now(),missionId:m.id,missionTitle:m.title,title:'Bloqueio no caminho crítico',description:'Solicitação hipotética de capacidade externa; não há permissão verificada.',type:'exception'});event(m,'Exceção simulada encaminhada à Caixa de Decisões.');}
function modalContent(){if(!s.modal)return '';const m=currentMission(),d=s.modal,typ=d.type;let title='',body='',footer='';const dismiss=`<button class="btn" onclick="closeModal()">Fechar</button>`;
if(typ==='newMission'){title='Nova missão';body=`<p>Escolha um projeto e explique o objetivo por texto ou ditado. O Afinamento produzirá o Prompt Afinado.</p><div class="field"><label>Projeto</label><select id="new-project">${projects.map(p=>`<option value="${p.id}" ${(d.project||s.project)===p.id?'selected':''}>${E(p.name)}</option>`).join('')}</select></div><div class="field"><label>Título breve</label><input id="new-title" maxlength="90" placeholder="Ex.: Revisar formulário de inscrições"></div><div class="field"><label>Descrição inicial</label><textarea rows="5" id="new-request" placeholder="Descreva a missão. Pode ditar e corrigir a transcrição antes de enviar."></textarea><div class="row"><button class="btn btn-small" onclick="appAct('voice','new-request')">♩ Ditar descrição</button></div><small>Ditado: dependendo do navegador, o áudio pode ser processado pelo provedor de reconhecimento de fala.</small></div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('createMission')">Iniciar Afinamento →</button>`}
else if(typ==='grantEnvelope'){title='Aprovar Afinamento e autorizações';body=`<p>O envelope fica vinculado à <b>Partitura da Missão v${m.promptVersion}</b> e às permissões demonstrativas selecionadas. A publicação continua fora do envelope inicial.</p><div class="policy-box"><h4>Objeto exato da aprovação</h4><p>${E(m.title)}<br><span class="mini-mono">Hash local demonstrativo: ${hash(JSON.stringify(m.prompt))}</span></p></div><div class="classes" style="margin-top:13px"><div class="class-card"><strong>Classe 1 — Antecipável</strong>${[['branch','Criar branch, commits e PR em ambiente permitido'],['preview','Gerar preview isolado (sem produção)'],['tests','Executar verificações seguras no escopo autorizado']].map(([key,desc])=>`<label class="check-line"><input type="checkbox" id="env-${key}" ${m.permissions[key]?'checked':''}><span><strong>${E(desc)}</strong><small>Somente simulação. Sem acesso real a serviços.</small></span></label>`).join('')}</div><div class="class-card"><strong>Classe 2 — Sob condições comprovadas</strong><label class="check-line"><input type="checkbox" id="env-conditional" ${m.permissions.conditional?'checked':''}><span><strong>Permitir regra condicional demonstrativa</strong><small>Na implementação real, S00 conferirá segurança, testes, reversibilidade e escopo a cada operação.</small></span></label></div><div class="class-card"><strong>Classe 3 — Por resultado</strong><p class="tagline">Campanhas, publicações, ampliações relevantes e efeitos irreversíveis exigem decisão vinculada à versão final. Não se concedem aqui.</p></div></div><div class="smallnote" style="margin-top:11px">Sem autenticação ou assinatura real neste protótipo. Esta aprovação não tem efeitos externos.</div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('grantEnvelope')">Confirmar e iniciar Execução</button>`}
else if(typ==='applyChatEdit'){title='Incorporar orientação ao Afinamento';body=`<p>A orientação será adicionada ao escopo, gerando uma nova versão do Prompt Afinado.</p><div class="panel-row">${E(s.pendingEdit)}</div><div class="alert">Se houver uma autorização anterior, ela será invalidada até nova aprovação da versão atual.</div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('applyChatEdit')">Incorporar e versionar</button>`}
else if(typ==='diff'){title='Histórico do Prompt Afinado';const prev=m.promptHistory[m.promptHistory.length-2],last=m.promptHistory[m.promptHistory.length-1];body=`<p>As modificações da Partitura da Missão criam versões sucessivas. Cada autorização deve apontar uma versão exata.</p><div class="statline"><span>Versão atual</span><strong>v${m.promptVersion}</strong></div><div class="statline"><span>Hash de demonstração</span><strong class="mini-mono">${hash(JSON.stringify(m.prompt))}</strong></div>${prev?`<div class="field"><label>Objetivo anterior (v${prev.v})</label><div class="panel-row" style="background:var(--redbg)">${E(prev.prompt.objective)}</div></div><div class="field"><label>Objetivo atual (v${last.v})</label><div class="panel-row" style="background:var(--goodbg)">${E(last.prompt.objective)}</div></div>`:'<div class="alert">Esta é a primeira versão; ainda não há diferenças anteriores.</div>'}`;footer=dismiss}
else if(typ==='result'){const r=ensureMissionResult(m,d.resultId);title=r.name;body=`<div class="row wrap">${statePill(r.status)}${pill('Versão '+r.version)}${pill(r.kind)}${pill('Hash '+hash(r.source+r.version))}</div><p>${E(r.explanation)}</p><div class="field"><label>Conteúdo demonstrativo</label><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:16px;border-radius:12px;font-size:12px;line-height:1.6">${E(r.source)}</pre></div><div class="alert">Um resultado só poderá ser considerado publicado quando o adapter externo confirmar o efeito. Este HTML não publica nada.</div>`;footer=`${dismiss}<button class="btn btn-small" onclick="appAct('downloadResult','${r.id}')">↓ Baixar</button>`}
else if(typ==='refineResult'){const r=ensureMissionResult(m,d.resultId);title='Refinar resultado individual';body=`<p><b>${E(r.name)}</b> · v${r.version}. Ajustar preserva a versão anterior e permite orientação complementar. Refazer gera uma nova tentativa.</p><div class="field"><label>Orientação para a nova versão</label><textarea id="refine-guidance" rows="4" placeholder="Ex.: manter estrutura, corrigir medidas, atualizar relatório..."></textarea></div><div class="alert">Se já existisse efeito externo real, uma nova versão não desfaria automaticamente o efeito anterior. Seria necessária uma operação compensatória própria.</div>`;footer=`${dismiss}<button class="btn" onclick="appAct('refineResult','${r.id}','ajustar')">Ajustar</button><button class="btn btn-primary" onclick="appAct('refineResult','${r.id}','refazer')">Refazer</button>`}
else if(typ==='publish'){const r=ensureMissionResult(m,d.resultId);title='Aprovação específica de publicação';body=`<p>A publicação é uma operação de <b>Classe 3</b> e exige aprovação sobre o conteúdo final.</p><div class="policy-box"><h4>Pacote final demonstrativo</h4><p>Entregável: ${E(r.name)}<br>Missão: ${E(m.title)}<br>Versão: ${r.version}<br>Hash demonstrativo: <span class="mini-mono">${hash(r.source+r.version)}</span></p></div><div class="alert">Esta ação registrará um aceite **somente no protótipo**. Não há canal, conta ou envio real conectado.</div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('publishResult','${r.id}')">Aprovar versão final (demo)</button>`}
else if(typ==='endWithout'){title='Encerrar sem concluir';body=`<p>A missão poderá ser encerrada com justificativa. Os entregáveis e seus estados não serão apagados.</p><div class="field"><label>Motivo</label><textarea id="closing-reason" placeholder="Descreva por que a missão não foi concluída"></textarea></div>`;footer=`${dismiss}<button class="btn btn-danger" onclick="appAct('endWithout')">Encerrar esta missão</button>`}
else if(typ==='emergency'){title='Parar tudo — confirmação';body=`<div class="alert danger"><b>Parada de emergência global.</b> Na aplicação produtiva, o S00 deverá revogar envelopes e bloquear novas operações. Efeitos externos já iniciados exigem reconciliação.</div><p>Este botão apenas altera o estado das missões simuladas. Não existe conexão com nenhum serviço real.</p>`;footer=`${dismiss}<button class="btn btn-danger" onclick="appAct('emergency')">Confirmar parada demonstrativa</button>`}
else if(typ==='addInstrument'){title='Cadastrar novo instrumento';body=`<p>Cadastro não é ativação. Uma ferramenta precisa de operador autorizado e relações válidas.</p><div class="field"><label>Tipo</label><select id="new-type"><option value="Ferramenta">Ferramenta externa</option><option value="Rede">Agente executor</option><option value="Orientação">Agente de orientação</option><option value="Núcleo">Serviço determinístico</option></select></div><div class="field"><label>Nome do instrumento</label><input id="new-instrument-name" maxlength="48" placeholder="Ex.: Serviço de busca"></div><div class="field"><label>Provedor ou implementação</label><input id="new-instrument-provider" maxlength="48" placeholder="Ex.: Adapter HTTP"></div><div class="field"><label>Operador responsável (obrigatório para ferramenta)</label><select id="new-instrument-operator"><option value="">Escolha o operador</option>${demo.instruments.filter(x=>x.type!=='Ferramenta').map(x=>`<option value="${x.id}">${E(x.id)} — ${E(x.name)}</option>`).join('')}</select></div><div class="smallnote">Status inicial: proposto. Exigirá teste de conectividade, revisão da partitura/contrato e decisão de habilitação.</div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('addInstrument')">Cadastrar proposto</button>`}
else if(typ==='addLink'){title='Criar laço entre instrumentos';body=`<p>Laços descrevem relações funcionais. Não criam permissões nem credenciais.</p><div class="field"><label>Origem</label><select id="link-from">${demo.instruments.map(x=>`<option value="${x.id}" ${x.id===s.selectedNode?'selected':''}>${E(x.id)} · ${E(x.name)}</option>`).join('')}</select></div><div class="field"><label>Destino</label><select id="link-to">${demo.instruments.map(x=>`<option value="${x.id}">${E(x.id)} · ${E(x.name)}</option>`).join('')}</select></div><div class="field"><label>Tipo de relação</label><select id="link-type"><option value="informa">Informa</option><option value="opera">Opera</option><option value="requer_capacidade">Requer capacidade</option></select></div><div class="smallnote">O editor rejeita auto-laços, duplicatas e ciclos entre agentes de orientação na preparação.</div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('addLink')">Criar laço demonstrativo</button>`}
else if(typ==='editNode'){const n=demo.instruments.find(x=>x.id===s.selectedNode);title='Vínculo de implementação';body=`<p><b>${E(n.id)} — ${E(n.name)}</b>. O papel permanece estável mesmo ao trocar provedor ou modelo.</p><div class="field"><label>Implementação (apenas demo)</label><input id="edit-node-provider" value="${E(n.provider)}"></div><div class="field"><label>Estado demonstrativo</label><select id="edit-node-status">${['proposto','não verificado','verificado','suspenso','desativado'].map(v=>`<option ${v===n.status?'selected':''} value="${v}">${v}</option>`).join('')}</select></div>`;footer=`${dismiss}<button class="btn btn-primary" onclick="appAct('editNode')">Salvar vínculo local</button>`}
else if(typ==='disableNode'){const n=demo.instruments.find(x=>x.id===s.selectedNode);title='Desativar instrumento';body=`<p><b>${E(n.id)} — ${E(n.name)}</b></p><div class="alert danger">A desativação real precisaria revogar permissões e recalcular impactos em missões em curso, preservando o histórico dos usos anteriores.</div>`;footer=`${dismiss}<button class="btn btn-danger" onclick="appAct('disableNode')">Desativar neste cenário</button>`}
else if(typ==='decision'){const dec=demo.decisions.find(x=>x.id===d.decisionId);title='Decisão excepcional';body=`<div class="alert">${E(dec.title)} — ${E(dec.description)}</div><p>Missão: <b>${E(dec.missionTitle)}</b>. O Maestro pode autorizar uma alternativa restrita ou manter o bloqueio. Sem resposta, nada é autorizado.</p><div class="policy-box"><h4>Recomendação demonstrativa</h4><p>Preservar os entregáveis independentes e não autorizar uma conexão cujo estado ainda não foi verificado.</p></div>`;footer=`${dismiss}<button class="btn btn-small btn-danger" onclick="appAct('decide','${dec.id}','rejeitar')">Manter bloqueio</button><button class="btn btn-primary" onclick="appAct('decide','${dec.id}','autorizar')">Resolver exceção (demo)</button>`}
else if(typ==='missionInfo'){title='Detalhes da missão';body=`<div class="statline"><span>ID demonstrativo</span><strong>${E(m.id)}</strong></div><div class="statline"><span>Projeto</span><strong>${E(projects.find(p=>p.id===m.project).name)}</strong></div><div class="statline"><span>Partitura</span><strong>v${m.promptVersion} · ${hash(JSON.stringify(m.prompt))}</strong></div><div class="statline"><span>Estado</span><strong>${E(statusText[m.status])}</strong></div><div class="statline"><span>Execução real</span><strong>Não conectada</strong></div>`;footer=dismiss}
else if(typ==='manageProvider'){title='Gestão de consumo — '+E(d.provider);body=`<p>Não há API de faturamento conectada neste protótipo.</p><div class="statline"><span>Saldo</span><strong>Desconhecido</strong></div><div class="statline"><span>Recarga automática</span><strong>Desativada</strong></div><div class="alert">Para a versão real, definir teto por chamada, missão, projeto e período, com reservas atômicas pelo S00. Nenhum botão realiza pagamento.</div>`;footer=dismiss}
else if(typ==='policy'){title='Proposta de política';body=`<p>Uma alteração de teto operacional será registrada como proposta. Somente o Maestro pode ampliar permissões e limites reais.</p><div class="field"><label>Descrição da mudança</label><textarea placeholder="Ex.: autorizar até R$ ... em projeto ..."></textarea></div><div class="alert">Sem efeito real. No Regente 1.0 o S00 registrará a decisão sobre o objeto exato, escopo e validade.</div>`;footer=dismiss}
else if(typ==='proposeVersion'){title='Proposta de alteração canônica';body=`<p>O painel de Administração poderá produzir uma proposta de PR para o GitHub com diff, versão e hash da Grade e contratos afetados.</p><div class="alert">Nenhum PR é criado por este protótipo. O repositório oficial permanece inalterado.</div>`;footer=dismiss}
else if(typ==='readiness'){title='Verificação de prontidão';body=`<p>O catálogo real deve fornecer evidência por instrumento, operação e ambiente, com data e validade. Situação fictícia neste exemplo:</p><div class="statline"><span>GitHub · leitura</span>${pill('Desconhecido','warn')}</div><div class="statline"><span>Claude · API</span>${pill('Não verificado','warn')}</div><div class="statline"><span>Canva · bridge</span>${pill('Não conectado neste HTML','warn')}</div><div class="alert">Não presumir que conta conectada em outro assistente seja uma conexão do Regente.</div>`;footer=dismiss}
else{title='Informação';body='<p>Nenhuma ação adicional disponível nesta demonstração.</p>';footer=dismiss}
return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="row spread" style="align-items:flex-start"><div><div class="eyebrow">REGENTE 1.0 · PROTÓTIPO</div><h2>${title}</h2></div><button class="btn btn-small btn-ghost" onclick="closeModal()" aria-label="Fechar">✕</button></div>${body}<div class="modal-foot">${footer}</div></div></div>`}
function checkCycle(from,to){if(!/^C\d+/.test(from)||!/^C\d+/.test(to))return false;const edges=demo.links.filter(l=>/^C\d+/.test(l.from)&&/^C\d+/.test(l.to));edges.push({from,to});const visiting=new Set(),done=new Set();function visit(n){if(visiting.has(n))return true;if(done.has(n))return false;visiting.add(n);for(const l of edges.filter(e=>e.from===n)){if(visit(l.to))return true}visiting.delete(n);done.add(n);return false}return [...new Set(edges.map(x=>x.from))].some(visit)}
function appAct(action,...args){const m=currentMission();switch(action){
case 'menu':s.menu=!s.menu;break;
case 'theme':s.theme=s.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',s.theme==='dark');break;
case 'phase':s.phase=args[0];m.phase=args[0];break;
case 'adminTab':s.adminTab=args[0];break;
case 'nodeSelect':s.selectedNode=args[0];s.adminTab='graph';break;
case 'promptEdit':s.editing=!s.editing;break;
case 'savePrompt':{const keys=['objective','criteria','scope','plan','risks'];const p={};keys.forEach(k=>p[k]=$('#pr-'+k).value.trim());if(!p.objective||!p.criteria){toast('Objetivo e critérios são obrigatórios.');return}s.editing=false;m.prompt=p;m.promptVersion++;m.promptHistory.push({v:m.promptVersion,prompt:clone(p)});m.approved=false;m.permissions.conditional=false;m.status='em_afinamento';addEvent(m,'Prompt Afinado revisado para v'+m.promptVersion+'. Autorizações anteriores não acompanham mudanças materiais.');toast('Nova versão do Prompt Afinado salva.');break}
case 'sendMessage':{const inp=$('#mission-message');if(!inp||!inp.value.trim())return;const v=inp.value.trim();addChat(m,'Maestro',v);s.pendingEdit=v;addChat(m,'Regente','Orientação recebida. Proponho incorporá-la à próxima versão do Prompt Afinado; na demonstração ela será adicionada ao escopo.');openModal('applyChatEdit');break}
case 'applyChatEdit':{const v=s.pendingEdit;if(v){m.prompt.scope+='\nOrientação adicional: '+v;m.promptVersion++;m.promptHistory.push({v:m.promptVersion,prompt:clone(m.prompt)});m.approved=false;m.status='em_afinamento';m.phase='afinamento';s.phase='afinamento';addEvent(m,'Orientação por chat incorporada ao Prompt Afinado v'+m.promptVersion+'.');s.pendingEdit='';}s.modal=null;toast('Orientação incorporada e versionada.');break}
case 'createMission':{const proj=$('#new-project').value,title=$('#new-title').value.trim(),req=$('#new-request').value.trim();if(!title||!req){toast('Preencha título e descrição da missão.');return}const id='m'+Date.now();demo.missions.unshift(newMission(id,proj,title,req));s.missionId=id;s.project=proj;s.phase='afinamento';s.page='mission';s.modal=null;toast('Missão criada: Afinamento iniciado em modo demonstrativo.');break}
case 'grantEnvelope':{m.permissions={branch:$('#env-branch').checked,preview:$('#env-preview').checked,tests:$('#env-tests').checked,conditional:$('#env-conditional').checked};m.approved=true;m.paused=false;m.stopped=false;m.status='em_execucao';m.phase='execucao';s.phase='execucao';m.tasks.forEach(t=>{if(t.status==='planejada')t.status='em_execucao'});addEvent(m,'Afinamento v'+m.promptVersion+' aprovado neste protótipo; envelope demonstrativo registrado.');addChat(m,'Regente','A autorização demonstrativa foi registrada. As tarefas independentes podem avançar; nenhuma operação real será chamada.');s.modal=null;toast('Envelope demonstrativo concedido.');break}
case 'advanceDemo':{if(!m.approved||m.paused||m.stopped){toast('Execução bloqueada: verifique o envelope e a pausa.');return}m.runStep++;if(m.runStep===1){m.tasks[0].status='produzida';m.results[0].status='produzido';m.tasks[1].status='em_execucao';m.tasks[2].status='bloqueada';m.results[2].status='bloqueado';m.tasks[3].status='em_execucao';addEvent(m,'HTML produzido. Integração externa bloqueada; tarefas independentes continuam.');}else if(m.runStep===2){m.tasks[1].status='produzida';m.results[1].status='produzido';m.tasks[3].status='produzida';m.results[3].status='produzido';addEvent(m,'Relatório e documentação produzidos apesar de integração bloqueada.');}else if(m.runStep===3){if(m.tasks[2].status==='bloqueada'){addDecision(m);toast('Exceção criada na Caixa de Decisões; outras entregas continuam disponíveis.')}else{m.tasks[2].status='produzida';m.results[2].status='produzido';addEvent(m,'Última tarefa recuperada com sucesso demonstrativo.')}}else {m.tasks.forEach(t=>{if(t.status==='em_execucao')t.status='produzida'});m.results.forEach(r=>{if(r.status==='planejado')r.status='produzido'});addEvent(m,'Execução demonstrativa avançou; entregáveis disponíveis para avaliação.');}if(m.results.some(r=>r.status==='produzido'))m.status='em_resultados';break}
case 'resolveBlock':{const t=m.tasks.find(t=>t.status==='bloqueada');if(t){t.status='produzida';const r=m.results.find(r=>r.id===t.result);if(r)r.status='produzido';addEvent(m,'Bloqueio demonstrativo resolvido apenas na tarefa afetada.');toast('Tarefa desbloqueada; demais resultados preservados.')}break}
case 'pauseMission':{if(m.stopped){toast('Parada global: abra um novo envelope para retomar esta missão.');openModal('grantEnvelope');return;}m.paused=!m.paused;m.status=m.paused?'pausada':'em_execucao';addEvent(m,m.paused?'Missão pausada por decisão demonstrativa.':'Missão retomada dentro do envelope existente.');break}
case 'acceptResult':{const r=ensureMissionResult(m,args[0]);if(!r||!['produzido','auditado','confirmado'].includes(r.status))break;r.status='aceito';addEvent(m,'Entregável '+r.name+' v'+r.version+' aceito pelo Maestro (simulação).');toast('Entregável aceito individualmente.');break}
case 'refineResult':{const r=ensureMissionResult(m,args[0]),mode=args[1],txt=$('#refine-guidance')?.value.trim();if(!txt){toast('Escreva a orientação para a revisão.');return}r.version++;r.status='produzido';r.source+='\n\nRevisão v'+r.version+' ('+mode+'): '+txt;addEvent(m,'Resultado '+r.name+' revisado individualmente para v'+r.version+'.');s.modal=null;toast('Nova versão produzida somente nesta demonstração.');break}
case 'publishResult':{const r=ensureMissionResult(m,args[0]);if(r){r.status='publicado';addEvent(m,'Aprovação por versão final do resultado '+r.name+' v'+r.version+' (não houve publicação real).');s.modal=null;toast('Aprovado neste protótipo; nenhuma publicação real foi realizada.')}break}
case 'branchResult':{const r=ensureMissionResult(m,args[0]),n=newMission('m'+Date.now(),m.project,'Desdobramento: '+r.name,'Desdobrar o entregável '+r.name+' da missão '+m.title+'.');n.messages.unshift({who:'Regente',body:'Missão derivada de '+m.title+'. Fonte: '+r.name+' v'+r.version+'.'});demo.missions.unshift(n);s.missionId=n.id;s.phase='afinamento';s.page='mission';toast('Missão derivada criada, preservando o resultado original.');break}
case 'conclude':{if(!m.results.filter(r=>r.required).every(r=>['aceito','publicado'].includes(r.status))){toast('Faltam critérios essenciais aceitos.');break}m.status='concluida';addEvent(m,'Missão concluída mediante aceite dos critérios essenciais na simulação.');toast('Missão concluída no protótipo.');break}
case 'endWithout':{const reason=$('#closing-reason').value.trim();if(!reason){toast('Registre um motivo.');return}m.status='encerrada';addEvent(m,'Encerrada sem conclusão: '+reason);s.modal=null;toast('Encerramento sem conclusão registrado.');break}
case 'emergency':{demo.missions.forEach(n=>{if(!['concluida','encerrada'].includes(n.status)){n.stopped=true;n.paused=true;n.approved=false;n.status='pausada';addEvent(n,'Parada de emergência global acionada no protótipo. Envelope revogado.')}});s.modal=null;toast('PARADA DEMONSTRATIVA: missões pausadas, sem efeitos externos.');break}
case 'decide':{const d=demo.decisions.find(x=>x.id===args[0]),accept=args[1]==='autorizar';if(!d)break;const target=demo.missions.find(x=>x.id===d.missionId);if(target){if(accept){const t=target.tasks.find(t=>t.status==='bloqueada');if(t){t.status='produzida';const r=target.results.find(r=>r.id===t.result);if(r)r.status='produzido'}}addEvent(target,accept?'Exceção resolvida na simulação; condição verificada ficticiamente.':'Exceção rejeitada; bloqueio preservado.');}demo.decisions=demo.decisions.filter(x=>x.id!==d.id);s.modal=null;toast(accept?'Exceção resolvida apenas na demonstração.':'Bloqueio mantido.');break}
case 'downloadManifest':downloadText('manifesto-'+m.id+'.txt',`REGENTE 1.0 · DEMONSTRAÇÃO\nMissão ${m.title}\nPartitura v${m.promptVersion}\nEntregáveis:\n`+m.results.map(r=>`${r.id} | ${r.name} | v${r.version} | ${r.status}`).join('\n'));break;
case 'downloadResult':{const r=ensureMissionResult(m,args[0]);if(r)downloadText('regente-demo-'+r.id+'-v'+r.version+(r.kind==='HTML'?'.html':'.txt'),resultText(m,r));break}
case 'addInstrument':{const name=$('#new-instrument-name').value.trim(),provider=$('#new-instrument-provider').value.trim(),operator=$('#new-instrument-operator').value,type=$('#new-type').value;if(!name||!provider||(type==='Ferramenta'&&!operator)){toast('Informe nome, provedor e operador responsável para ferramenta.');return}const prefix=type==='Ferramenta'?'F':type==='Orientação'?'C':type==='Núcleo'?'S':'A';const n=1+Math.max(0,...demo.instruments.filter(x=>x.id.startsWith(prefix)).map(x=>Number(x.id.replace(/\D/g,''))||0));const id=prefix+(prefix==='C'||prefix==='S'?String(n).padStart(2,'0'):n);demo.instruments.push({id,name,type,provider,operator:operator||'Não definido',status:'proposto'});if(operator)demo.links.push({from:operator,to:id,type:'opera'});s.selectedNode=id;s.adminTab='inventory';s.modal=null;toast('Instrumento '+id+' cadastrado como proposto. Sem ativação real.');break}
case 'addLink':{const from=$('#link-from').value,to=$('#link-to').value,type=$('#link-type').value;if(from===to){toast('Um instrumento não pode criar auto-laço.');return}if(demo.links.some(l=>l.from===from&&l.to===to&&l.type===type)){toast('Este laço já existe.');return}if(checkCycle(from,to)){toast('Relação rejeitada: geraria ciclo na sequência de preparação.');return}demo.links.push({from,to,type});s.modal=null;toast('Laço adicionado somente ao cenário local.');break}
case 'removeLink':demo.links.splice(+args[0],1);toast('Laço removido do cenário.');break;
case 'editNode':{const n=demo.instruments.find(x=>x.id===s.selectedNode);if(n){n.provider=$('#edit-node-provider').value.trim();n.status=$('#edit-node-status').value;s.modal=null;toast('Vínculo demonstrativo atualizado.')}break}
case 'disableNode':{const n=demo.instruments.find(x=>x.id===s.selectedNode);if(n){n.status='desativado';s.modal=null;toast('Instrumento desativado somente neste cenário.')}break}
case 'voice':startVoice(args[0]);return;
default:break;
}render()}
let recognition=null;
function startVoice(targetId){const target=$('#'+targetId);if(!target){toast('Campo de transcrição não encontrado.');return}const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){toast('Ditado não disponível neste navegador. Use o campo de texto.');return}if(recognition){try{recognition.stop()}catch{}recognition=null;toast('Ditado interrompido.');return}const ok=window.confirm('O ditado usará o serviço de reconhecimento de fala disponibilizado pelo navegador. O áudio pode ser processado pelo fornecedor. Deseja iniciar? A transcrição aparecerá para revisão antes do envio.');if(!ok)return;try{recognition=new API();recognition.lang='pt-BR';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{const transcript=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ');const el=$('#'+targetId);if(el){el.value=(el.value.trim()?el.value.trim()+' ':'')+transcript;el.focus()}toast('Ditado transcrito. Revise o texto antes de enviar.')};recognition.onerror=e=>{toast('Ditado indisponível: '+String(e.error||'erro desconhecido'))};recognition.onend=()=>{recognition=null};recognition.start();toast('Ditado iniciado. Fale e depois revise a transcrição.')}catch(e){recognition=null;toast('Não foi possível iniciar o ditado: '+e.message)}}
function render(){const root=$('#app');if(!root)return;const body=s.page==='dashboard'?dashboard():s.page==='projects'?`${heading('Instituto','Projetos','Cada projeto mantém contexto, missões e recursos próprios.')}<div class="grid cols-3">${projects.map(p=>`<button class="card project-hero" style="text-align:left" onclick="nav('project',{project:'${p.id}'})"><div class="project-icon" style="background:${p.color}">${p.symbol}</div><div><h3>${E(p.name)}</h3><p>${E(p.desc)}</p></div><span class="action-link">Abrir projeto →</span></button>`).join('')}</div>`:s.page==='project'?projectPage():s.page==='missions'?missionsPage():s.page==='mission'?missionPage():s.page==='orchestra'?orchestraPage():s.page==='resources'?resourcesPage():decisionsPage();root.innerHTML=`<div class="shell">${sidebar()}<div class="workspace">${topbar()}<main class="main">${body}</main></div></div>${s.modal?modalContent():''}`;}
window.nav=nav;window.appAct=appAct;window.openModal=openModal;window.closeModal=closeModal;
// A visualização não possui backend. Nenhuma autorização, conexão ou pagamento real é realizado.
render();
</script>
</body>
</html>
